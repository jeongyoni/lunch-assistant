name: Weekly Summary

on:
  schedule:
    # UTC 08:00 = KST 17:00, 매주 금요일 (그 주 데이터가 다 쌓인 뒤)
    - cron: "0 0 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  weekly:
    runs-on: ubuntu-latest
    env:
      TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
      ADMIN_WEBHOOK_URL: ${{ secrets.ADMIN_WEBHOOK_URL }}
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 주간 리포트 전송
        run: python run.py weekly
