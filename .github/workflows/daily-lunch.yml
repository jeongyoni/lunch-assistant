name: Daily Lunch

on:
  schedule:
    # UTC 00:00 = KST 09:00, 평일(월~금). GitHub cron은 수 분 지연될 수 있음
    - cron: "30 1 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "캐시 무시하고 강제 재실행/재전송"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-lunch
  cancel-in-progress: false

jobs:
  lunch:
    runs-on: ubuntu-latest
    env:
      # 시크릿
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
      ADMIN_WEBHOOK_URL: ${{ secrets.ADMIN_WEBHOOK_URL }}
      # 변수 (Settings > Variables) — 시크릿 아님
      MENU_URL: ${{ vars.MENU_URL }}
      VOTE_URL: ${{ vars.VOTE_URL }}
      GH_OWNER: ${{ github.repository_owner }}
      GH_REPO: ${{ github.event.repository.name }}
      GH_BRANCH: ${{ github.ref_name }}
      IMAGE_QUALITY: ${{ vars.IMAGE_QUALITY || 'medium' }}
      ENABLE_IMAGE: ${{ vars.ENABLE_IMAGE || 'true' }}
      FORCE: ${{ inputs.force || 'false' }}
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      # 1) 스크래핑 + AI 생성 → data/, images/ 저장 (전송 X)
      - name: 1) 메뉴 수집 + AI 분석/이미지
        run: python run.py build

      # 2) 이미지·캐시를 먼저 push 해야 raw URL이 살아있음
      - name: 2) 캐시·이미지 커밋 & 푸시
        run: |
          git config user.name "lunch-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data images 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "lunch(build): ${{ github.run_id }}"
            git push
          fi

      - name: 3) push 반영 대기
        run: sleep 5

      # 4) 캐시를 읽어 Teams 전송 (이미지 live 상태)
      - name: 4) Teams 전송
        run: python run.py notify

      # 5) notified 플래그 반영분 push (중복 전송 방지 영속화)
      - name: 5) 전송 상태 커밋 & 푸시
        if: always()
        run: |
          git add data 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "lunch(notify): ${{ github.run_id }}"
            git push
          fi
